services:
  db:
    image: postgres:16-alpine
    container_name: zsdb
    environment:
      POSTGRES_USER: zs
      POSTGRES_PASSWORD: zsdevweb
      POSTGRES_DB: zsdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zs -d zsdb"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: zsbackend
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]
    ports:
      - "8000:8000"

volumes:
  pgdata:
